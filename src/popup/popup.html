<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>YouTube Groups</title>
</head>

<body>

    <h1>Мои группы</h1>

    <div class="controls">
        <button id="button" type="button">Создать группу</button>
        <input
            type="text"
            id="groupInput"
            class="hidden"
            maxlength="80"
            placeholder="Введите название группы"
        >
    </div>

    <div class="transfer">
        <button id="exportButton" type="button" class="ghost-btn">Скачать файл</button>
        <button id="importButton" type="button" class="ghost-btn">Загрузить файл</button>
        <input id="importFile" class="hidden" type="file" accept="application/json,.json">
    </div>
    <p class="hint">Файл можно открыть на другом компьютере. Вход в YouTube группы не переносит: они лежат в браузере. Если в Chrome включена синхронизация того же Google-аккаунта, список подтянется сам.</p>

    <p id="status" class="status hidden" role="status"></p>

    <ul id="groupList"></ul>

    <script type="module" src="./popup.ts"></script>

</body>

</html>
